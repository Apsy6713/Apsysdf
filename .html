
<!DOCTYPE html>
<html>
<head>
    <title>Class 8 Student Registration Form</title>
</head>

<body>

    <h1>Class 8 Student Registration Form</h1>
    <p>Please fill in your details below.</p>

    <form>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>

        <label for="phone">Mobile Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter mobile number">
        <br><br>

        <label for="class">Select Class:</label><br>
        <select id="class" name="class">
            <option value="">-- Select Class --</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
        </select>
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <p>Select Your Favourite Subjects:</p>
        <input type="checkbox" id="maths" name="subjects" value="Mathematics">
        <label for="maths">Mathematics</label><br>

        <input type="checkbox" id="science" name="subjects" value="Science">
        <label for="science">Science</label><br>

        <input type="checkbox" id="english" name="subjects" value="English">
        <label for="english">English</label><br>

        <input type="checkbox" id="sst" name="subjects" value="SST">
        <label for="sst">Social Science</label><br>

        <input type="checkbox" id="computer" name="subjects" value="Computer">
        <label for="computer">Computer</label>
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="35" placeholder="Enter your address"></textarea>
        <br><br>

        <input type="checkbox" id="agree" name="agreement" required>
        <label for="agree">I confirm that the information provided is correct.</label>
        <br><br>

        <input type="submit" value="Submit Form">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
